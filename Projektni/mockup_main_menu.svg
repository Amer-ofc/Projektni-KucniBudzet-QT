<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#667eea"/>
      <stop offset="1" stop-color="#764ba2"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="cardShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="6" stdDeviation="18" flood-color="#000" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg)" />

  <!-- Sidebar -->
  <rect x="32" y="32" width="240" height="836" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.06)"/>
  <text x="152" y="80" font-family="Segoe UI, Arial" font-size="20" fill="white" text-anchor="middle" font-weight="700">HomeBudget</text>

  <!-- Year selector -->
  <rect x="52" y="110" width="200" height="36" rx="6" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.08)"/>
  <text x="152" y="134" font-family="Segoe UI" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">2026</text>

  <!-- Sidebar buttons -->
  <g font-family="Segoe UI, Arial" font-size="14" fill="rgba(255,255,255,0.95)">
    <rect x="52" y="164" width="200" height="42" rx="8" fill="transparent"/>
    <text x="84" y="192">📊 Dashboard</text>

    <rect x="52" y="216" width="200" height="42" rx="8" fill="transparent"/>
    <text x="84" y="244">🧾 Transactions</text>

    <rect x="52" y="268" width="200" height="42" rx="8" fill="transparent"/>
    <text x="84" y="296">📈 Reports</text>

    <rect x="52" y="320" width="200" height="42" rx="8" fill="transparent"/>
    <text x="84" y="348">⚙️ Settings</text>
  </g>

  <!-- Main area cards -->
  <g filter="url(#cardShadow)">
    <rect x="300" y="48" width="1000" height="160" rx="12" fill="transparent" stroke="none" />

    <!-- Card 1 -->
    <rect x="320" y="60" width="300" height="120" rx="10" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.09)"/>
    <text x="340" y="88" font-family="Segoe UI" font-size="12" fill="rgba(255,255,255,0.8)">Balance</text>
    <text x="340" y="120" font-family="Segoe UI" font-size="20" fill="white" font-weight="700">$12,450</text>

    <!-- Card 2 -->
    <rect x="640" y="60" width="300" height="120" rx="10" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.09)"/>
    <text x="660" y="88" font-family="Segoe UI" font-size="12" fill="rgba(255,255,255,0.8)">Income (YTD)</text>
    <text x="660" y="120" font-family="Segoe UI" font-size="20" fill="white" font-weight="700">$28,940</text>

    <!-- Card 3 -->
    <rect x="960" y="60" width="300" height="120" rx="10" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.09)"/>
    <text x="980" y="88" font-family="Segoe UI" font-size="12" fill="rgba(255,255,255,0.8)">Expenses (YTD)</text>
    <text x="980" y="120" font-family="Segoe UI" font-size="20" fill="white" font-weight="700">$16,490</text>
  </g>

  <!-- Main content: table and chart -->
  <!-- Table area placeholder -->
  <rect x="320" y="240" width="560" height="480" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)"/>
  <text x="340" y="268" font-family="Segoe UI" font-size="14" fill="rgba(255,255,255,0.85)">Recent Transactions</text>

  <!-- Table rows (mock) -->
  <g font-family="Segoe UI" font-size="12" fill="rgba(255,255,255,0.9)">
    <rect x="330" y="300" width="520" height="32" rx="6" fill="rgba(255,255,255,0.02)"/>
    <text x="340" y="322">2026-05-15  •  Groceries  •  -$54.20</text>
    <rect x="330" y="340" width="520" height="32" rx="6" fill="transparent"/>
    <text x="340" y="362">2026-05-12  •  Salary     •  +$1,500.00</text>
    <rect x="330" y="380" width="520" height="32" rx="6" fill="rgba(255,255,255,0.02)"/>
    <text x="340" y="402">2026-05-08  •  Rent       •  -$720.00</text>
  </g>

  <!-- Chart area placeholder -->
  <rect x="900" y="240" width="420" height="480" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)"/>
  <text x="920" y="268" font-family="Segoe UI" font-size="14" fill="rgba(255,255,255,0.85)">Monthly Income vs Expenses</text>

  <!-- Simple bar chart mock -->
  <g>
    <!-- grid lines -->
    <line x1="930" y1="300" x2="1280" y2="300" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    <line x1="930" y1="340" x2="1280" y2="340" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    <line x1="930" y1="380" x2="1280" y2="380" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>

    <!-- bars (income blue, expenses pink) -->
    <rect x="950" y="320" width="28" height="60" rx="4" fill="#36A2FF"/>
    <rect x="988" y="350" width="28" height="30" rx="4" fill="#FF7A9A"/>

    <rect x="1030" y="290" width="28" height="90" rx="4" fill="#36A2FF"/>
    <rect x="1068" y="330" width="28" height="50" rx="4" fill="#FF7A9A"/>

    <rect x="1110" y="310" width="28" height="70" rx="4" fill="#36A2FF"/>
    <rect x="1148" y="345" width="28" height="35" rx="4" fill="#FF7A9A"/>
  </g>

  <!-- Footer quick actions -->
  <rect x="320" y="740" width="1000" height="120" rx="10" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.04)"/>
  <text x="340" y="772" font-family="Segoe UI" font-size="13" fill="rgba(255,255,255,0.9)">Quick Actions:</text>
  <g>
    <rect x="420" y="754" width="120" height="48" rx="8" fill="url(#accent)"/>
    <text x="480" y="786" font-family="Segoe UI" font-size="13" fill="white" text-anchor="middle">Add Income</text>

    <rect x="560" y="754" width="140" height="48" rx="8" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.08)"/>
    <text x="630" y="786" font-family="Segoe UI" font-size="13" fill="white" text-anchor="middle">Add Expense</text>
  </g>

</svg>
